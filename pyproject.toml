[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-design"
version = "0.1.0"
description = "芯片设计AI优化工具包 – AI-assisted chip design optimization toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["chip-design", "EDA", "VLSI", "placement", "routing", "timing"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chip_design*"]
